services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - emp-pulse-network
    restart: unless-stopped
  backend:
    profiles:
      - prod
    build:
      context: ./src/backend
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_OWNER_EMAIL: ${OWNER_EMAIL}
      APP_OWNER_PASSWORD: ${OWNER_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_ENABLED: ${MAIL_ENABLED}
      APP_BASE_URL: ${APP_BASE_URL}
      DEV_TEST_EMAIL_ENABLED: ${DEV_TEST_EMAIL_ENABLED}
    expose:
      - "8080"
    networks:
      - emp-pulse-network
    restart: unless-stopped
  backend-dev:
    profiles:
      - dev
    build:
      context: ./src/backend
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_OWNER_EMAIL: ${OWNER_EMAIL}
      APP_OWNER_PASSWORD: ${OWNER_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_ENABLED: ${MAIL_ENABLED}
      APP_BASE_URL: ${APP_BASE_URL}
      DEV_TEST_EMAIL_ENABLED: ${DEV_TEST_EMAIL_ENABLED}
    ports:
      - "8080:8080"
    networks:
      - emp-pulse-network
    restart: unless-stopped
  frontend:
    profiles:
      - prod
    build:
      context: ./src/frontend
      target: production-stage
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - emp-pulse-network
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    profiles:
      - prod
    depends_on:
      - frontend
      - backend
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      # - "${NGINX_HTTPS_PORT:-443}:443"   # uncomment when TLS certs are ready
    volumes:
      - ./src/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./src/nginx/certs:/etc/nginx/certs:ro   # mount TLS certs when enabling HTTPS
    networks:
      - emp-pulse-network
    restart: unless-stopped

networks:
  emp-pulse-network:
    driver: bridge

volumes:
  postgres_data: