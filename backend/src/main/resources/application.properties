spring.application.name=EmpPulse
server.port=8080
spring.session.jdbc.initialize-schema=never

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Only let the SMTP connectivity check affect /actuator/health when mail is
# actually in use. Otherwise (the default, mail disabled) its DOWN status would
# make the aggregate health 503, which the frontend's health probe reads as the
# whole backend being offline.
management.health.mail.enabled=${MAIL_ENABLED:false}

app.mail.from=${MAIL_FROM:no-reply@emppulse.local}
app.mail.enabled=${MAIL_ENABLED:false}
app.base-url=${APP_BASE_URL:http://localhost}
app.dev.test-email.enabled=${DEV_TEST_EMAIL_ENABLED:false}
app.password-reset.token-ttl=${PASSWORD_RESET_TOKEN_TTL:15m}

emppulse.autolog.cron=0 0 0 * * *
emppulse.autolog.zone=UTC
