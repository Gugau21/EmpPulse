name: Lint frontend Code Base

on:
  push:
    branches: [ "*" ]
    paths:
      - "frontend/**"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint_frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Frontend Code Base
        uses: github/super-linter/slim@v4
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILTER_REGEX_INCLUDE: .*frontend/.*
          VALIDATE_TYPESCRIPT_STANDARD: false
          VALIDATE_TYPESCRIPT_ESLINT: true
          VALIDATE_PRETTIER: true
          # super-linter bundles an old stylelint whose `string-quotes` rule
          # (removed upstream in stylelint 16) demands double quotes and so
          # conflicts with our Prettier `singleQuote`. Prettier owns CSS style;
          # CSS is still linted locally via `npm run lint:css` (stylelint 17).
          VALIDATE_CSS: false

  build_frontend:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build the Docker image
      run: docker build frontend --file frontend/Dockerfile

