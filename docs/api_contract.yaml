openapi: 3.0.0
info:
  title: EmpPulse API
  version: 1.0.0
  description: REST API for EmpPulse employee leave, department, and time tracking.
servers:
   - url: http://localhost:8080
     description: Local

security:
  - CookieAuth: []

tags:
  - name: Auth
  - name: Users
  - name: Departments
  - name: Employees
  - name: Admins
  - name: LeaveRequests
  - name: LoggedHours
  - name: DefaultHours
  - name: Exports
  - name: Preferences

paths:
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Sign in and create a session
      description: Authenticate with email and password and receive a JSESSIONID cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session; returns the caller's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Sign out and invalidate the current session
      responses:
        '200':
          description: Session invalidated
          content:
            text/plain:
              schema:
                type: string
                example: Logout successful
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/password/forgot:
    post:
      tags:
        - Auth
      summary: Request a password reset email
      description: >-
        Sends a password reset email to the given address. Returns 404 if the address does not
        belong to a registered user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
      responses:
        '204':
          description: Reset email queued
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/password/reset:
    post:
      tags:
        - Auth
      summary: Reset password with token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Password reset
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me:
    get:
      tags:
        - Users
      summary: Get my profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me/password/change:
    post:
      tags:
        - Users
      summary: Change password (logged in)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password changed and other sessions invalidated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me/preferences:
    patch:
      tags:
        - Preferences
      summary: Update my preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferencesUpdate'
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users:
    post:
      tags:
        - Users
      summary: Create a user (admin only)
      description: >
        Creates a user. Admins can only create users as employees.
        Owner can additionally create users as administrators.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created; returns the new user id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/{userId}:
    get:
      tags:
        - Users
      summary: Get user details (admin only)
      description: Owner can view all users. Admins can view employees they oversee.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Users
      summary: Update user (admin only)
      description: Owner can update all fields. Admins can update an employee's department and vacation balance.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '204':
          description: User updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Users
      summary: Soft delete user (owner only)
      description: Marks user as deleted; pending leave requests are hard deleted.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: User deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/{userId}/bonus-vacation-days:
    get:
      tags:
        - Users
      summary: Get employee bonus vacation days (admin only)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Bonus vacation days
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BonusVacationDays'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Users
      summary: Update employee bonus vacation days (admin only)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BonusVacationDayRequest'
      responses:
        '204':
          description: Bonus vacation days updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admins:
    get:
      tags:
        - Admins
      summary: List admins (owner only)
      description: Returns all non-deleted users who have admin profiles.
      responses:
        '200':
          description: Admins list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/departments:
    get:
      tags:
        - Departments
      summary: List departments
      description: Owner sees all departments; an admin sees only the ones they oversee.
      responses:
        '200':
          description: Departments list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Departments
      summary: Create department (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
      responses:
        '204':
          description: Department created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/departments/{departmentId}:
    get:
      tags:
        - Departments
      summary: Get department details
      parameters:
        - in: path
          name: departmentId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Department details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Departments
      summary: Update department (owner only)
      description: Rename the department and/or reassign its admins.
      parameters:
        - in: path
          name: departmentId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpdate'
      responses:
        '204':
          description: Department updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Departments
      summary: Delete department (owner only)
      description: Only possible if no Employees/Administrators are assigned to the department, and it is not the default department.
      parameters:
        - in: path
          name: departmentId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Department deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/departments/{departmentId}/default-hours:
    get:
      tags:
        - DefaultHours
      summary: Get department default week hours (admin only)
      parameters:
        - in: path
          name: departmentId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Default week hours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultWeekHours'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - DefaultHours
      summary: Set department default week hours (admin only)
      parameters:
        - in: path
          name: departmentId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultWeekHours'
      responses:
        '200':
          description: Default week hours saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultWeekHours'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/employees:
    get:
      tags:
        - Employees
      summary: List employees (admin only)
      description: Returns employees in the departments the caller oversees (the owner gets all).
      responses:
        '200':
          description: Employees list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/employees/{employeeId}/default-hours:
    get:
      tags:
        - DefaultHours
      summary: Get employee default week hours (admin only)
      parameters:
        - in: path
          name: employeeId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Default week hours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultWeekHours'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - DefaultHours
      summary: Set employee default week hours (admin only)
      parameters:
        - in: path
          name: employeeId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultWeekHours'
      responses:
        '200':
          description: Default week hours saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultWeekHours'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/employees/{employeeId}/logged-hours:
    get:
      tags:
        - LoggedHours
      summary: List logged work hours
      description: An admin reads any overseen employee's hours; an employee reads only their own.
      parameters:
        - in: path
          name: employeeId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Logged hours list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedHoursListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - LoggedHours
      summary: Create logged hours (admin only)
      parameters:
        - in: path
          name: employeeId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoggedHoursCreate'
      responses:
        '201':
          description: Logged hours created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedHours'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/employees/{employeeId}/logged-hours/{loggedHoursId}:
    patch:
      tags:
        - LoggedHours
      summary: Update logged hours (admin only)
      parameters:
        - in: path
          name: employeeId
          required: true
          schema:
            type: integer
        - in: path
          name: loggedHoursId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoggedHoursUpdate'
      responses:
        '200':
          description: Logged hours updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedHours'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - LoggedHours
      summary: Delete logged hours (admin only)
      parameters:
        - in: path
          name: employeeId
          required: true
          schema:
            type: integer
        - in: path
          name: loggedHoursId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Logged hours deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/leave-requests:
    get:
      tags:
        - LeaveRequests
      summary: List leave requests
      description: >
        Returns leave requests.
        - Owners see all requests.
        - Admins see only requests from departments they manage.
        - Employees see only their own requests.
      responses:
        '200':
          description: Leave requests list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - LeaveRequests
      summary: Create leave request
      description: Employees create their own requests. Admins can create on behalf of employees.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRequestCreate'
      responses:
        '201':
          description: Leave request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/leave-requests/{leaveRequestId}:
    get:
      tags:
        - LeaveRequests
      summary: Get leave request details
      parameters:
        - in: path
          name: leaveRequestId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Leave request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - LeaveRequests
      summary: Update a leave request
      description: >
        Updates an existing leave request.
        For employees, this edits a PENDING request.
        For admins, this updates the request in-place.
      parameters:
        - in: path
          name: leaveRequestId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRequestUpdate'
      responses:
        '200':
          description: Updated leave request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - LeaveRequests
      summary: Delete PENDING leave request (employee only)
      parameters:
        - in: path
          name: leaveRequestId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Leave request deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/leave-requests/{leaveRequestId}/cancel:
    patch:
      tags:
        - LeaveRequests
      summary: Cancel an approved leave request (employee only)
      parameters:
        - in: path
          name: leaveRequestId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Leave request canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/leave-requests/{leaveRequestId}/response:
    patch:
      tags:
        - LeaveRequests
      summary: Approve or reject a leave request (admin only)
      parameters:
        - in: path
          name: leaveRequestId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveResponseRequest'
      responses:
        '200':
          description: Leave request reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/leave-requests/{leaveRequestId}/modifications:
    post:
      tags:
        - LeaveRequests
      summary: Request a modification to an approved leave request (employee only)
      parameters:
        - in: path
          name: leaveRequestId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveModificationRequest'
      responses:
        '201':
          description: Leave request modification created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/export:
    get:
      tags:
        - Exports
      summary: Export organizational data (owner/admin only)
      description: >
        Returns a ZIP archive of CSV files for the caller's in-scope departments
        (an admin's overseen departments; all departments for the owner). The archive
        contains departments.csv, employees.csv, users.csv, leaves.csv, logged_hours.csv,
        monthly_work_hours.csv, bonus_vacation_days.csv, week_schedules.csv and schedule_blocks.csv.
      responses:
        '200':
          description: ZIP archive of CSV files
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      description: >
        Shape returned by the auth/access-control handlers (a machine-readable code plus
        message). Domain/business-rule errors are emitted by Spring's default /error handler
        and carry only timestamp/status/error/path (no message body).
      properties:
        code:
          type: string
        message:
          type: string

    Theme:
      type: string
      enum:
        - light
        - dark
        - system

    Language:
      type: string
      enum:
        - en
        - ukr

    LeaveType:
      type: string
      enum:
        - vacation
        - sick
        - personal

    LeaveStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
        - cancelled

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    PasswordForgotRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    PasswordResetRequest:
      type: object
      required:
        - token
        - newPassword
        - confirmNewPassword
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password
        confirmNewPassword:
          type: string
          format: password

    PasswordChangeRequest:
      type: object
      required:
        - currentPassword
        - newPassword
        - confirmNewPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
        confirmNewPassword:
          type: string
          format: password

    UserPreferences:
      type: object
      required:
        - theme
        - language
      properties:
        theme:
          $ref: '#/components/schemas/Theme'
        language:
          $ref: '#/components/schemas/Language'

    UserPreferencesUpdate:
      type: object
      properties:
        theme:
          $ref: '#/components/schemas/Theme'
        language:
          $ref: '#/components/schemas/Language'

    User:
      type: object
      required:
        - id
        - name
        - surname
        - email
        - owner
        - preferences
      properties:
        id:
          type: integer
        name:
          type: string
        surname:
          type: string
        email:
          type: string
          format: email
        owner:
          type: boolean
        preferences:
          $ref: '#/components/schemas/UserPreferences'
        employeeProfile:
          allOf:
            - $ref: '#/components/schemas/EmployeeProfile'
          nullable: true
        adminProfile:
          allOf:
            - $ref: '#/components/schemas/AdminProfile'
          nullable: true

    EmployeeProfile:
      type: object
      required:
        - employeeId
        - yearlyVacationBalance
        - vacationBalance
      properties:
        employeeId:
          type: integer
        departmentId:
          type: integer
          nullable: true
        departmentName:
          type: string
          nullable: true
        yearlyVacationBalance:
          type: integer
          description: The base annual allowance configured on the employee.
        vacationBalance:
          type: integer
          description: Days left, computed as yearlyVacationBalance + bonus days − used vacation days.
        activeLeave:
          allOf:
            - $ref: '#/components/schemas/ActiveLeave'
          nullable: true

    AdminProfile:
      type: object
      required:
        - adminId
        - departmentIds
      properties:
        adminId:
          type: integer
        departmentIds:
          type: array
          items:
            type: integer

    ActiveLeave:
      type: object
      required:
        - type
        - startDate
        - endDate
      properties:
        type:
          $ref: '#/components/schemas/LeaveType'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    UserSummary:
      type: object
      required:
        - id
        - name
        - surname
        - email
      properties:
        id:
          type: integer
        name:
          type: string
        surname:
          type: string
        email:
          type: string
          format: email

    UserCreate:
      type: object
      required:
        - name
        - surname
        - email
        - password
      properties:
        name:
          type: string
        surname:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        employeeDepartmentId:
          type: integer
          nullable: true
        yearlyVacationBalance:
          type: integer
          minimum: 0
        adminDepartmentIds:
          type: array
          items:
            type: integer
      description: >
        To create an employee, provide employeeDepartmentId (and optionally yearlyVacationBalance).
        To create an admin, provide adminDepartmentIds. A user can be both an admin and an employee.

    UserCreated:
      type: object
      required:
        - id
      properties:
        id:
          type: integer

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        surname:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        employeeDepartmentId:
          type: integer
          nullable: true
        changeEmployeeDepartment:
          type: boolean
          description: >
            When true, employeeDepartmentId is applied (a null value detaches the employee from
            their department). When false/omitted, the employee's department is left unchanged.
        yearlyVacationBalance:
          type: integer
          minimum: 0
        adminDepartmentIds:
          type: array
          items:
            type: integer

    BonusVacationDayRequest:
      type: object
      required:
        - year
        - days
      properties:
        year:
          type: integer
        days:
          type: integer
          minimum: 0

    BonusVacationDays:
      type: object
      required:
        - year
        - days
      properties:
        year:
          type: integer
        days:
          type: integer

    AdminSummary:
      type: object
      required:
        - id
        - user
        - departmentIds
      properties:
        id:
          type: integer
        user:
          $ref: '#/components/schemas/UserSummary'
        departmentIds:
          type: array
          items:
            type: integer

    AdminListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminSummary'

    Department:
      type: object
      required:
        - id
        - name
        - admins
      properties:
        id:
          type: integer
        name:
          type: string
        admins:
          type: array
          items:
            $ref: '#/components/schemas/AdminSummary'

    DepartmentCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        adminIds:
          type: array
          items:
            type: integer

    DepartmentUpdate:
      type: object
      properties:
        name:
          type: string
        adminIds:
          type: array
          items:
            type: integer

    DepartmentListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Department'

    EmployeeSummary:
      type: object
      required:
        - id
        - name
        - surname
        - active
      properties:
        id:
          type: integer
        name:
          type: string
        surname:
          type: string
        departmentId:
          type: integer
          nullable: true
        departmentName:
          type: string
          nullable: true
        active:
          type: boolean

    EmployeeListItem:
      type: object
      required:
        - id
        - name
        - surname
        - active
      properties:
        id:
          type: integer
        name:
          type: string
        surname:
          type: string
        departmentId:
          type: integer
          nullable: true
        departmentName:
          type: string
          nullable: true
        active:
          type: boolean
        activeLeave:
          allOf:
            - $ref: '#/components/schemas/ActiveLeave'
          nullable: true

    EmployeeListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeListItem'

    LeaveRequest:
      type: object
      required:
        - id
        - employee
        - type
        - paid
        - startDate
        - endDate
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        employee:
          $ref: '#/components/schemas/EmployeeSummary'
        type:
          $ref: '#/components/schemas/LeaveType'
        paid:
          type: boolean
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        reason:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/LeaveStatus'
        adminReviewerId:
          type: integer
          nullable: true
        adminComment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LeaveRequestCreate:
      type: object
      required:
        - type
        - paid
        - startDate
        - endDate
      properties:
        employeeId:
          type: integer
          nullable: true
        type:
          $ref: '#/components/schemas/LeaveType'
        paid:
          type: boolean
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        reason:
          type: string
          nullable: true
        adminComment:
          type: string
          nullable: true
      description: >
        reason is required when type=personal. employeeId is required (and adminComment is allowed)
        only when an admin creates a request on behalf of an employee.

    LeaveRequestUpdate:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/LeaveType'
        paid:
          type: boolean
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        reason:
          type: string
          nullable: true
        adminComment:
          type: string
          nullable: true

    LeaveModificationRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/LeaveType'
        paid:
          type: boolean
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        reason:
          type: string
          nullable: true

    LeaveResponseRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - approved
            - rejected
          description: The admin's decision on the pending request.
        adminComment:
          type: string
          nullable: true

    LeaveRequestListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LeaveRequest'

    LoggedHours:
      type: object
      required:
        - id
        - employeeId
        - adminId
        - date
        - startTime
        - endTime
      properties:
        id:
          type: integer
        employeeId:
          type: integer
        adminId:
          type: integer
        date:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time

    LoggedHoursCreate:
      type: object
      required:
        - date
        - startTime
        - endTime
      properties:
        date:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time

    LoggedHoursUpdate:
      type: object
      properties:
        date:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time

    LoggedHoursListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LoggedHours'

    DefaultWeekHours:
      type: object
      required:
        - days
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/DefaultWeekHoursDay'
      description: dayOfWeek uses 0=Monday through 6=Sunday.

    DefaultWeekHoursDay:
      type: object
      required:
        - dayOfWeek
        - intervals
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/TimeInterval'

    TimeInterval:
      type: object
      required:
        - startTime
        - endTime
      properties:
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
